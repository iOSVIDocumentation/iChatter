<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iChatter - Вход</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #555d65; font-family: Helvetica, sans-serif; }
        .wrapper { display: table; width: 100%; height: 100%; }
        .cell { display: table-cell; vertical-align: middle; text-align: center; }
        .login-box { background: #3b434a; padding: 20px; border-radius: 8px; width: 290px; margin: 0 auto; color: white; box-sizing: border-box; }
        .lang-switch { text-align: right; margin-bottom: 10px; }
        .lang-switch button { background: #4a627a; color: white; border: none; padding: 4px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; }
        .tabs { margin-bottom: 15px; display: flex; justify-content: space-between; }
        .tab-btn { width: 31%; padding: 8px 0; background: #2c3e50; color: #aaa; border: none; cursor: pointer; border-radius: 4px; font-size: 13px; }
        .tab-btn.active { background: #4a627a; color: white; font-weight: bold; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .action-btn { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; margin-top: 10px; }
        #code-section, #reset-section { background: #2c3e50; padding: 10px; border-radius: 4px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="cell">
            <div class="login-box">
                <div class="lang-switch">
                    <button onclick="switchLang()" id="lang-btn">EN</button>
                </div>
                <div class="tabs">
                    <button id="tab-login" class="tab-btn active" onclick="setMode('login')">Вход</button>
                    <button id="tab-register" class="tab-btn" onclick="setMode('register')">Регистрация</button>
                    <button id="tab-reset" class="tab-btn" onclick="setMode('reset')">Сброс</button>
                </div>
                <input type="email" id="email" placeholder="Почта">
                <input type="text" id="username" placeholder="Имя пользователя" style="display:none;">
                <input type="password" id="password" placeholder="Пароль">
                <button id="main-btn" class="action-btn" onclick="handleMainAction()">Войти</button>
                
                <!-- Подтверждение авторизации -->
                <div id="code-section">
                    <p id="code-text">Код отправлен на почту</p>
                    <input type="text" id="code" placeholder="Код из письма">
                    <button class="action-btn" style="background: #2980b9;" onclick="verifyCode()">Подтвердить</button>
                </div>

                <!-- Подтверждение сброса пароля -->
                <div id="reset-section">
                    <p id="reset-text">Код сброса отправлен на почту</p>
                    <input type="text" id="reset-code" placeholder="Код сброса">
                    <input type="password" id="new-password" placeholder="Новый пароль">
                    <button id="save-pass-btn" class="action-btn" style="background: #e67e22;" onclick="submitResetPassword()">Сохранить пароль</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        var API = window.location.protocol + '//' + window.location.host;
        var currentMode = 'login';
        var currentLang = 'ru';

        var T = {
            ru: {
                login: 'Вход', register: 'Регистрация', reset: 'Сброс',
                email: 'Почта', username: 'Имя пользователя', password: 'Пароль',
                newPassword: 'Новый пароль',
                btnLog: 'Войти', btnReg: 'Зарегистрироваться', btnReset: 'Запросить код',
                btnSavePass: 'Сохранить пароль',
                codeSent: 'Код отправлен на почту', resetCodeSent: 'Код сброса отправлен на почту',
                btnConfirm: 'Подтвердить', enterCode: 'Введите код',
                wrongCode: 'Неверный код', error: 'Ошибка сервера', fillAll: 'Заполните все поля',
                passChanged: 'Пароль успешно изменен! Теперь войдите.'
            },
            en: {
                login: 'Login', register: 'Register', reset: 'Reset',
                email: 'Email', username: 'Username', password: 'Password',
                newPassword: 'New Password',
                btnLog: 'Log In', btnReg: 'Sign Up', btnReset: 'Request Code',
                btnSavePass: 'Save Password',
                codeSent: 'Code sent to email', resetCodeSent: 'Reset code sent to email',
                btnConfirm: 'Confirm', enterCode: 'Enter code',
                wrongCode: 'Invalid code', error: 'Server error', fillAll: 'Fill all fields',
                passChanged: 'Password changed successfully! Please log in.'
            }
        };

        function t(key) { return T[currentLang][key] || key; }

        function switchLang() {
            currentLang = (currentLang === 'ru') ? 'en' : 'ru';
            document.getElementById('lang-btn').textContent = (currentLang === 'ru') ? 'EN' : 'RU';
            updateUI();
        }

        function updateUI() {
            document.getElementById('tab-login').textContent = t('login');
            document.getElementById('tab-register').textContent = t('register');
            document.getElementById('tab-reset').textContent = t('reset');
            document.getElementById('email').placeholder = t('email');
            document.getElementById('username').placeholder = t('username');
            document.getElementById('password').placeholder = t('password');
            document.getElementById('code-text').textContent = t('codeSent');
            document.getElementById('reset-text').textContent = t('resetCodeSent');
            document.getElementById('save-pass-btn').textContent = t('btnSavePass');
            document.getElementById('new-password').placeholder = t('newPassword');

            if (currentMode === 'login') {
                document.getElementById('main-btn').textContent = t('btnLog');
            } else if (currentMode === 'register') {
                document.getElementById('main-btn').textContent = t('btnReg');
            } else if (currentMode === 'reset') {
                document.getElementById('main-btn').textContent = t('btnReset');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tab-login').className = (mode === 'login') ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-register').className = (mode === 'register') ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-reset').className = (mode === 'reset') ? 'tab-btn active' : 'tab-btn';
            
            document.getElementById('username').style.display = (mode === 'register') ? 'block' : 'none';
            document.getElementById('password').style.display = (mode === 'reset') ? 'none' : 'block';
            
            document.getElementById('code-section').style.display = 'none';
            document.getElementById('reset-section').style.display = 'none';
            
            updateUI();
        }

        function handleMainAction() {
            if (currentMode === 'reset') {
                requestResetCode();
            } else {
                sendCode();
            }
        }

        function sendCode() {
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var username = document.getElementById('username').value.trim();

            if (!email || !password || (currentMode === 'register' && !username)) {
                alert(t('fillAll'));
                return;
            }

            var xhr = new XMLHttpRequest();
            xhr.open('POST', API + '/api/send-code', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var data = {};
                    try { data = JSON.parse(xhr.responseText); } catch(e) {}
                    if (xhr.status === 200 && data.success) {
                        document.getElementById('code-section').style.display = 'block';
                    } else {
                        alert(data.error || t('error'));
                    }
                }
            };
            xhr.send(JSON.stringify({ email: email, password: password, username: username, mode: currentMode, language: currentLang }));
        }

        function verifyCode() {
            var email = document.getElementById('email').value.trim();
            var code = document.getElementById('code').value.trim();
            if (!code) { alert(t('enterCode')); return; }
            var xhr = new XMLHttpRequest();
            xhr.open('POST', API + '/api/verify-code', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var data = {};
                    try { data = JSON.parse(xhr.responseText); } catch(e) {}
                    if (xhr.status === 200 && data.success) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('email', email);
                        localStorage.setItem('lang', currentLang);
                        window.location.href = 'chat.html';
                    } else {
                        alert(data.error || t('wrongCode'));
                    }
                }
            };
            xhr.send(JSON.stringify({ email: email, code: code, device: 'Web' }));
        }

        function requestResetCode() {
            var email = document.getElementById('email').value.trim();
            if (!email) { alert(t('fillAll')); return; }
            var xhr = new XMLHttpRequest();
            xhr.open('POST', API + '/api/forgot-password', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var data = {};
                    try { data = JSON.parse(xhr.responseText); } catch(e) {}
                    if (xhr.status === 200 && data.success) {
                        document.getElementById('reset-section').style.display = 'block';
                    } else {
                        alert(data.error || t('error'));
                    }
                }
            };
            xhr.send(JSON.stringify({ email: email }));
        }

        function submitResetPassword() {
            var email = document.getElementById('email').value.trim();
            var code = document.getElementById('reset-code').value.trim();
            var newPassword = document.getElementById('new-password').value;
            if (!code || !newPassword) { alert(t('fillAll')); return; }
            var xhr = new XMLHttpRequest();
            xhr.open('POST', API + '/api/reset-password', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var data = {};
                    try { data = JSON.parse(xhr.responseText); } catch(e) {}
                    if (xhr.status === 200 && data.success) {
                        alert(t('passChanged'));
                        setMode('login');
                    } else {
                        alert(data.error || t('wrongCode'));
                    }
                }
            };
            xhr.send(JSON.stringify({ email: email, code: code, newPassword: newPassword }));
        }
    </script>
</body>
</html>
