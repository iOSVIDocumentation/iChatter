<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iChatter</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #2c3e50; color: #fff; font-family: Helvetica, sans-serif; display: flex; justify-content: center; align-items: center; }
        .container { width: 300px; max-width: 90%; background: #34495e; border-radius: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
        h2 { margin-top: 0; font-size: 22px; }
        .tabs { display: flex; margin-bottom: 16px; border-radius: 8px; overflow: hidden; }
        .tabs button { flex: 1; padding: 10px; background: #2c3e50; border: none; color: #aaa; font-size: 14px; cursor: pointer; }
        .tabs button.active { background: #1abc9c; color: white; font-weight: bold; }
        .form { display: none; }
        .form.active { display: block; }
        .field { margin-bottom: 12px; text-align: left; }
        .field label { font-size: 13px; display: block; margin-bottom: 4px; }
        .field input { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; background: #ecf0f1; color: #222; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #1abc9c; border: none; color: white; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 6px; }
        .btn:active { background: #16a085; }
        .info { font-size: 13px; margin: 16px 0; }
        .error { color: #e74c3c; font-size: 13px; margin-top: 8px; }
        .lang-row { text-align: right; margin-bottom: 12px; }
        .lang-row select { padding: 4px 8px; border-radius: 4px; border: none; background: #ecf0f1; color: #222; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-row">
            <select id="lang-select" onchange="changeLang(this.value)">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
        </div>
        <h2>iChatter</h2>
        <div class="tabs">
            <button id="tab-login" class="active" onclick="switchTab('login')">Вход</button>
            <button id="tab-reg" onclick="switchTab('register')">Регистрация</button>
        </div>

        <!-- Вход -->
        <div id="form-login" class="form active">
            <div class="field">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="you@example.com">
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль">
            </div>
            <button class="btn" onclick="requestCode('login')">Получить код</button>
        </div>

        <!-- Регистрация -->
        <div id="form-register" class="form">
            <div class="field">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="you@example.com">
            </div>
            <div class="field">
                <label>Ник</label>
                <input type="text" id="reg-username" placeholder="Придумайте ник">
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" id="reg-password" placeholder="Введите пароль">
            </div>
            <button class="btn" onclick="requestCode('register')">Получить код</button>
        </div>

        <!-- Код подтверждения -->
        <div id="form-code" class="form">
            <p class="info">Введите код, отправленный на почту</p>
            <div class="field">
                <input type="text" id="code-input" placeholder="6-значный код" maxlength="6">
            </div>
            <button class="btn" onclick="verifyCode()">Подтвердить</button>
            <button class="btn" style="background:#7f8c8d; margin-top:8px;" onclick="resetToLogin()">← Назад</button>
            <div id="error-msg" class="error"></div>
        </div>
    </div>

    <script>
        var BASE = window.location.protocol + '//' + window.location.host;
        var API = BASE;
        var mode = 'login';
        var lang = 'ru';
        var pendingEmail = '';
        var pendingUsername = '';

        function byId(id) { return document.getElementById(id); }

        function changeLang(l) {
            lang = l;
            // Статичные надписи не меняются, только язык запроса
        }

        function switchTab(tab) {
            mode = tab;
            byId('tab-login').className = tab === 'login' ? 'active' : '';
            byId('tab-reg').className = tab === 'register' ? 'active' : '';
            byId('form-login').style.display = tab === 'login' ? 'block' : 'none';
            byId('form-register').style.display = tab === 'register' ? 'block' : 'none';
            byId('form-code').style.display = 'none';
        }

        function requestCode(act) {
            var email, password, username;
            if (act === 'register') {
                email = byId('reg-email').value.trim().toLowerCase();
                password = byId('reg-password').value;
                username = byId('reg-username').value.trim();
            } else {
                email = byId('login-email').value.trim().toLowerCase();
                password = byId('login-password').value;
            }

            if (!email || !password || (act === 'register' && !username)) {
                alert('Заполните все поля');
                return;
            }

            pendingEmail = email;
            pendingUsername = username || '';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', API + '/api/send-code', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    byId('form-login').style.display = 'none';
                    byId('form-register').style.display = 'none';
                    byId('form-code').style.display = 'block';
                    byId('code-input').value = '';
                    byId('error-msg').textContent = '';
                } else if (xhr.readyState === 4 && xhr.status >= 400) {
                    try {
                        var err = JSON.parse(xhr.responseText);
                        alert(err.error || 'Ошибка');
                    } catch (e) { alert('Ошибка'); }
                }
            };
            xhr.send(JSON.stringify({
                email: email,
                username: username || '',
                password: password,
                mode: act,
                language: lang
            }));
        }

        function verifyCode() {
            var code = byId('code-input').value.trim();
            if (!code) return;

            var xhr = new XMLHttpRequest();
            xhr.open('POST', API + '/api/verify-code', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var resp = JSON.parse(xhr.responseText);
                    if (resp.success) {
                        localStorage.setItem('token', resp.token);
                        localStorage.setItem('email', pendingEmail);
                        window.location.href = 'chat.html';
                    }
                } else if (xhr.readyState === 4 && xhr.status >= 400) {
                    byId('error-msg').textContent = 'Неверный код';
                }
            };
            xhr.send(JSON.stringify({
                email: pendingEmail,
                code: code,
                device: 'Web'
            }));
        }

        function resetToLogin() {
            byId('form-code').style.display = 'none';
            if (mode === 'register') {
                byId('form-register').style.display = 'block';
            } else {
                byId('form-login').style.display = 'block';
            }
        }
    </script>
</body>
</html>
