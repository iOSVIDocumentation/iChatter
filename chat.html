<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iChatter</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #555d65; color: #fff; font-family: Helvetica, sans-serif; overflow: hidden; }
        body.light-mode { background: #E2E7ED; color: #222; }
        body.light-mode #header { background: #2c3e50; }
        body.light-mode #chats-panel, body.light-mode #archive-panel, body.light-mode #settings-panel { background: white; }
        body.light-mode #messages { background: #E2E7ED; }
        body.light-mode .panel-section { background: #f5f5f5; border-color: #ddd; }
        body.light-mode .panel-section input { background: white; color: #222; }
        body.light-mode .chat-item { border-color: #eee; }
        body.light-mode .msg { background: white; color: #222; }
        body.light-mode .msg.my { background: #dcf8c6; color: #222; }
        body.light-mode .msg .sender { color: #555; }
        body.light-mode .msg .time { color: #999; }
        body.light-mode #form-container { background: #cbd2d9; }
        body.light-mode .settings-row { border-color: #eee; }
        body.light-mode .settings-row input, .settings-row select { background: white; color: #222; }
        body.light-mode #bottom-nav { background: #cbd2d9; }
        body.light-mode .nav-btn { background: #2c3e50; border-color: #ccc; }
        body.light-mode .nav-btn.active { background: #4a627a; }
        body.light-mode #emoji-picker { background: #dde2e8; border-top-color: #bbb; }

        #header { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #2c3e50; color: white; line-height: 44px; padding: 0 10px; z-index: 10; box-sizing: border-box; }
        #btn-back { background: #4a627a; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-right: 8px; display: none; font-weight: bold; }
        #btn-back:active { background: #37526a; }
        #chat-title { font-size: 14px; font-weight: bold; display: inline; cursor: pointer; vertical-align: middle; }

        #main-content { position: fixed; top: 44px; bottom: 50px; left: 0; right: 0; overflow: hidden; }
        #chats-panel, #archive-panel, #settings-panel { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: #3b434a; overflow-y: scroll; -webkit-overflow-scrolling: touch; z-index: 2; display: none; }
        #chat-area { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: #3b434a; overflow: hidden; z-index: 2; display: none; }

        #messages { position: absolute; top: 0; left: 0; right: 0; bottom: 50px; padding: 10px; overflow-y: scroll; -webkit-overflow-scrolling: touch; box-sizing: border-box; background: #555d65; }

        #form-container { position: absolute; bottom: 0; left: 0; right: 0; height: 50px; background: #3b434a; box-sizing: border-box; padding: 5px; display: block; }
        #form { position: relative; width: 100%; height: 100%; }

        .media-btn, .emoji-btn {
            position: absolute; top: 5px; bottom: 5px;
            background: #4a627a; border: none; border-radius: 4px;
            width: 36px; font-size: 16px; cursor: pointer; color: white;
        }
        .media-btn { left: 0; }
        .emoji-btn { right: 72px; }
        .media-btn:active, .emoji-btn:active { background: #37526a; }

        #input { position: absolute; left: 42px; top: 5px; bottom: 5px; right: 114px; width: auto; box-sizing: border-box; font-size: 15px; border-radius: 4px; border: none; padding: 0 8px; background: white; color: #222; outline: none; }
        #send-btn { position: absolute; right: 0; top: 5px; bottom: 5px; width: 66px; background: #27ae60; color: white; border: none; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }
        #send-btn:active { background: #1e8449; }

        .panel-section { padding: 10px; border-bottom: 1px solid #4a627a; background: #2c3e50; display: -webkit-box; display: -webkit-flex; display: flex; gap: 8px; }
        .panel-section input { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; padding: 8px; border: none; border-radius: 4px; font-size: 14px; background: white; color: #222; }
        .panel-section button { padding: 8px 14px; background: #4a627a; color: white; border: none; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .panel-section button:active { background: #37526a; }

        .chat-item { padding: 12px 10px; border-bottom: 1px solid #4a627a; cursor: pointer; position: relative; }
        .chat-item:active { background: #4a627a; }
        .chat-item .name { font-weight: bold; font-size: 15px; }
        .chat-item .status { font-size: 12px; color: #aaa; margin-top: 2px; }
        .chat-item .status.online { color: #4cd964; font-weight: bold; }
        .chat-item .archive-btn { position: absolute; right: 10px; top: 12px; background: #e74c3c; color: white; border: none; padding: 4px 10px; border-radius: 3px; font-size: 10px; cursor: pointer; }
        .chat-item .unarchive-btn { background: #27ae60; }

        .msg { padding: 8px 10px; background: #2c3e50; margin-bottom: 8px; border-radius: 8px; word-wrap: break-word; font-size: 14px; position: relative; max-width: 80%; color: #fff; clear: both; float: left; }
        .msg.my { background: #27ae60; float: right; }
        .msg .sender { font-weight: bold; font-size: 12px; color: #ccc; margin-bottom: 2px; }
        .msg.my .sender { color: rgba(255,255,255,0.75); }
        .msg .time { font-size: 10px; color: #aaa; margin-left: 5px; float: right; margin-top: 4px; }
        .msg .text { display: inline; }
        .msg img.msg-img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
        .msg .edited-tag { font-size: 10px; color: #ddd; font-style: italic; }
        .msg .actions { display: none; position: absolute; right: 5px; top: -12px; }
        .msg:hover .actions { display: block; }
        .msg .actions button { font-size: 10px; padding: 2px 5px; border: none; border-radius: 3px; cursor: pointer; color: white; float: left; margin-left: 2px; }
        .msg .actions .edit-btn { background: #f39c12; }
        .msg .actions .del-btn { background: #e74c3c; }

        .settings-row { padding: 12px 10px; border-bottom: 1px solid #4a627a; }
        .settings-row label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 13px; }
        .settings-row input, .settings-row select { width: 100%; padding: 8px; border: none; border-radius: 4px; font-size: 14px; box-sizing: border-box; background: white; color: #222; }
        .settings-row button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .settings-row button:active { background: #1e8449; }

        .avatar-grid { overflow: hidden; margin-top: 6px; }
        .avatar-grid img { width: 44px; height: 44px; border-radius: 22px; margin: 4px; border: 2px solid transparent; cursor: pointer; float: left; }
        .avatar-grid img.selected { border-color: #27ae60; }
        .wallpaper-grid { overflow: hidden; margin-top: 6px; }
        .wallpaper-grid img { width: 70px; height: 44px; margin: 4px; border: 2px solid transparent; cursor: pointer; object-fit: cover; float: left; border-radius: 4px; }
        .wallpaper-grid img.selected { border-color: #27ae60; }

        #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: #3b434a; display: table; width: 100%; z-index: 20; }
        .nav-btn { display: table-cell; text-align: center; vertical-align: middle; background: #2c3e50; color: #aaa; font-size: 12px; cursor: pointer; border-right: 1px solid #4a627a; }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { background: #4a627a; color: white; font-weight: bold; }

        #emoji-picker {
            position: absolute; bottom: 50px; left: 0; right: 0;
            height: 180px; background: #2c3e50;
            border-top: 1px solid #4a627a;
            display: none; padding: 8px; overflow-y: auto; z-index: 150;
        }
        .emoji-item {
            font-size: 22px; text-align: center; cursor: pointer;
            padding: 5px; border-radius: 4px;
            float: left; width: 14.28%; box-sizing: border-box;
        }
        .emoji-item:active { background: #4a627a; }

        #partner-profile-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 9999;
            display: none; overflow-y: auto;
        }
        #partner-profile-box {
            background: #3b434a; color: white;
            width: 260px; padding: 20px; border-radius: 12px;
            text-align: center; position: relative;
            margin: 60px auto 40px auto;
            border: 1px solid #4a627a;
        }
        #partner-profile-box img { width: 80px; height: 80px; border-radius: 40px; margin-bottom: 10px; border: 2px solid #27ae60; display: block; margin-left: auto; margin-right: auto; }
        #partner-profile-box .close-btn { position: absolute; top: 10px; right: 15px; font-size: 22px; cursor: pointer; color: #aaa; font-weight: bold; }
        .partner-detail { margin: 6px 0; font-size: 14px; color: #ccc; }
        .partner-detail b { color: white; }
    </style>
</head>
<body class="dark-mode">
    <div id="header">
        <button id="btn-back" onclick="goBack()">&#9664; Назад</button>
        <span id="chat-title">iChatter</span>
    </div>

    <div id="main-content">
        <div id="chats-panel">
            <div class="panel-section">
                <input type="text" id="search-input" placeholder="Введите ID (6 цифр)">
                <button onclick="findUser()">Найти</button>
            </div>
            <div id="chats-list"></div>
        </div>

        <div id="archive-panel">
            <div style="padding:10px;font-weight:bold;border-bottom:1px solid #4a627a;color:#ccc;">Архивные чаты</div>
            <div id="archive-list"></div>
        </div>

        <div id="settings-panel">
            <div style="padding:10px;font-weight:bold;border-bottom:1px solid #4a627a;color:#ccc;">Настройки</div>
            <div class="settings-row">
                <label>Язык / Language</label>
                <select id="lang-select" onchange="setLang(this.value)">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="settings-row">
                <label>Тема</label>
                <select id="theme-select" onchange="setTheme(this.value)">
                    <option value="dark">Тёмная</option>
                    <option value="light">Светлая</option>
                </select>
            </div>
            <div class="settings-row">
                <label>Обои чата</label>
                <div class="wallpaper-grid" id="wallpaper-grid"></div>
            </div>
            <div class="settings-row">
                <label>Ник (не меняется)</label>
                <input type="text" id="set-username" disabled style="background:#ccc; color:#555;">
            </div>
            <div class="settings-row">
                <label>Отображаемое имя</label>
                <input type="text" id="set-displayname" placeholder="Как вас видят другие">
            </div>
            <div class="settings-row">
                <label>Возраст</label>
                <input type="number" id="set-age" placeholder="Возраст" min="0" max="150">
            </div>
            <div class="settings-row">
                <label>О себе</label>
                <input type="text" id="set-about" placeholder="Расскажите о себе">
            </div>
            <div class="settings-row">
                <label>Аватар</label>
                <div class="avatar-grid" id="avatar-grid"></div>
                <button style="margin-top:6px; background:#4a627a; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; width:100%;" onclick="document.getElementById('avatar-file').click()">Загрузить свой аватар</button>
                <input type="file" id="avatar-file" accept="image/*" style="display:none;" onchange="uploadCustomAvatar(this)">
            </div>
            <div class="settings-row">
                <label>Мой ID: <b id="my-id-display">...</b></label>
            </div>
            <div class="settings-row">
                <label>Устройства</label>
                <div id="devices-list"></div>
            </div>
            <div class="settings-row">
                <button onclick="saveSettings()">Сохранить</button>
            </div>
        </div>

        <div id="chat-area">
            <div id="messages"></div>
            <div id="emoji-picker"></div>
            <div id="form-container">
                <form id="form" onsubmit="return false;" autocomplete="off">
                    <button type="button" class="media-btn" onclick="document.getElementById('media-input').click()">📷</button>
                    <input type="file" id="media-input" accept="image/*" style="display:none;" onchange="sendImageAttachment(this)">
                    <input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Сообщение...">
                    <button type="button" class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
                    <button type="button" id="send-btn">Отпр.</button>
                </form>
            </div>
        </div>
    </div>

    <div id="bottom-nav">
        <div class="nav-btn active" id="nav-chats" onclick="showTab('chats')">Чаты</div>
        <div class="nav-btn" id="nav-archive" onclick="showTab('archive')">Архив</div>
        <div class="nav-btn" id="nav-settings" onclick="showTab('settings')">Настр.</div>
    </div>

    <div id="partner-profile-overlay" onclick="closePartnerProfile()">
        <div id="partner-profile-box" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closePartnerProfile()">x</span>
            <img id="partner-avatar" src="" alt="Avatar">
            <div class="partner-detail"><b id="partner-displayname"></b></div>
            <div class="partner-detail">@<span id="partner-username"></span></div>
            <div class="partner-detail">ID: <span id="partner-id"></span></div>
            <div class="partner-detail" id="partner-status"></div>
            <div class="partner-detail" id="partner-age"></div>
            <div class="partner-detail" id="partner-about"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
